name: Publish UnifiedTV releases

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to GitHub instead of retaining a signed validation artifact only
        type: boolean
        default: false

concurrency:
  group: unifiedtv-release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      base: ${{ steps.plan.outputs.base }}
      already_released: ${{ steps.plan.outputs.already_released }}
      has_previous_apk: ${{ steps.plan.outputs.has_previous_apk }}
    env:
      GH_REPO: ${{ github.repository }}
      SIGNER_SHA256: ${{ vars.UNIFIEDTV_SIGNER_SHA256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Plan versions from published releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/34.0.0"
          python3 tools/unifiedtv_release.py --aapt "$tools/aapt" --apksigner "$tools/apksigner" \
            --fingerprint "$SIGNER_SHA256" plan
      - name: Verify UnifiedTV integration and release policy
        if: steps.plan.outputs.already_released == 'false'
        run: python3 -m unittest discover -s tests -p 'test_unifiedtv*.py' -v
      - name: Compile, test and lint the official package without signing credentials
        if: steps.plan.outputs.already_released == 'false'
        working-directory: launcher
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION_CODE: ${{ steps.plan.outputs.code }}
        run: |
          set -euo pipefail
          bash gradlew --no-daemon \
            -PlauncherApplicationId=io.github.spidey000.unifiedtv \
            -PunifiedReleaseVersionCode="$VERSION_CODE" \
            -PunifiedReleaseVersionName="${TAG#v}" \
            -PunifiedUnsignedRelease=true \
            testReleaseUnitTest lintRelease assembleRelease
      - name: Sign with the permanent key
        if: steps.plan.outputs.already_released == 'false'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          KEYSTORE_BASE64: ${{ secrets.UNIFIEDTV_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.UNIFIEDTV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UNIFIEDTV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UNIFIEDTV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" || -z "$SIGNER_SHA256" ]]; then
            echo '::error::Configure the four signing secrets and UNIFIEDTV_SIGNER_SHA256; nothing will be published.'
            exit 1
          fi
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/unifiedtv-signing.XXXXXX")
          trap 'rm -rf -- "$signing_dir"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.jks"
          unset KEYSTORE_BASE64
          tools="$ANDROID_HOME/build-tools/34.0.0"
          mkdir -p dist
          "$tools/zipalign" -f 4 launcher/app/build/outputs/apk/release/app-release-unsigned.apk "$signing_dir/aligned.apk"
          "$tools/apksigner" sign --ks "$signing_dir/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "dist/UnifiedTV-$TAG.apk" "$signing_dir/aligned.apk"
      - name: Verify the signed APK and generate SHA256SUMS
        if: steps.plan.outputs.already_released == 'false'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION_CODE: ${{ steps.plan.outputs.code }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/34.0.0"
          python3 tools/unifiedtv_release.py --aapt "$tools/aapt" --apksigner "$tools/apksigner" \
            --fingerprint "$SIGNER_SHA256" verify "dist/UnifiedTV-$TAG.apk" "${TAG#v}" "$VERSION_CODE"
          cd dist
          sha256sum "UnifiedTV-$TAG.apk" > SHA256SUMS
      - name: Retain validated APK and checksum
        if: steps.plan.outputs.already_released == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unifiedtv-signed-release
          path: |
            dist/*.apk
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: >-
      needs.build.outputs.already_released == 'false' &&
      vars.UNIFIEDTV_PUBLISH_ENABLED == 'true' &&
      ((github.event_name == 'push' && needs.build.outputs.has_previous_apk == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.build.outputs.tag }}
      BASE: ${{ needs.build.outputs.base }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unifiedtv-signed-release
          path: dist/
      - name: Publish only after verifying assets on the draft
        run: |
          set -euo pipefail
          if [[ "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" != "$GITHUB_SHA" ]]; then
            echo 'A newer main commit superseded this run; its release will include these changes.'
            exit 0
          fi
          apk="UnifiedTV-$TAG.apk"
          (cd dist && sha256sum --check --strict SHA256SUMS)
          # Creating the exact tag atomically fails if another writer already used it.
          gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)" = "$GITHUB_SHA"
          gh release create "$TAG" --draft --verify-tag --title "UnifiedTV $TAG" \
            --notes-start-tag "$BASE" --generate-notes "dist/$apk" dist/SHA256SUMS
          verified=$(mktemp -d)
          gh release download "$TAG" --pattern "$apk" --pattern SHA256SUMS --dir "$verified"
          cmp dist/SHA256SUMS "$verified/SHA256SUMS"
          (cd "$verified" && sha256sum --check --strict SHA256SUMS)
          gh release edit "$TAG" --draft=false --latest
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)" = "$GITHUB_SHA"
          public=$(mktemp -d)
          url="$GITHUB_SERVER_URL/$GH_REPO/releases/download/$TAG"
          for file in "$apk" SHA256SUMS; do
            curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
              --max-time 60 --output "$public/$file" "$url/$file"
          done
          cmp dist/SHA256SUMS "$public/SHA256SUMS"
          (cd "$public" && sha256sum --check --strict SHA256SUMS)
          gh release view "$TAG" --json url,assets,isDraft --jq \
            'select(.isDraft == false) | .url, (.assets[] | [.name, .size, .url] | @tsv)' >> "$GITHUB_STEP_SUMMARY"
          printf '\nSHA-256: `%s`\n' "$(cut -d ' ' -f 1 dist/SHA256SUMS)" >> "$GITHUB_STEP_SUMMARY"
