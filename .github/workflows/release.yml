name: Publish UnifiedTV releases

# Every merge (or direct push) to main produces the next version, but only
# after Android tests, lint and APK compilation succeed. A signed APK is
# attached only when a persistent signing key has been configured.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: unifiedtv-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Validate and build Android TV
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    env:
      UNIFIEDTV_KEYSTORE_PASSWORD: ${{ secrets.UNIFIEDTV_KEYSTORE_PASSWORD }}
      UNIFIEDTV_KEY_ALIAS: ${{ secrets.UNIFIEDTV_KEY_ALIAS }}
      UNIFIEDTV_KEY_PASSWORD: ${{ secrets.UNIFIEDTV_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Verify UnifiedTV integration
        run: python3 -m unittest discover -s tests -p 'test_unifiedtv.py' -v
      - name: Load a persistent signing key when configured
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.UNIFIEDTV_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$UNIFIEDTV_KEYSTORE_PASSWORD" && -n "$UNIFIEDTV_KEY_ALIAS" && -n "$UNIFIEDTV_KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/unifiedtv-release.jks"
            chmod 600 "$RUNNER_TEMP/unifiedtv-release.jks"
            echo "UNIFIEDTV_KEYSTORE_FILE=$RUNNER_TEMP/unifiedtv-release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No persistent release signing key configured: source-only release if build passes."
          fi
      - name: Build, test and lint
        working-directory: launcher
        shell: bash
        run: |
          set -euo pipefail
          code=$((10000 + GITHUB_RUN_NUMBER))
          chmod +x gradlew
          ./gradlew --no-daemon \
            -PlauncherApplicationId=io.github.spidey000.unifiedtv \
            -PunifiedReleaseVersionCode="$code" \
            -PunifiedReleaseVersionName="0.1.${GITHUB_RUN_NUMBER}" \
            testReleaseUnitTest lintRelease assembleRelease
      - name: Verify release signature and stage APK
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk=launcher/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
          mkdir -p dist
          cp "$apk" "dist/UnifiedTV-v0.1.${GITHUB_RUN_NUMBER}.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS
      - name: Upload signed release asset
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unifiedtv-signed-release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Create versioned GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download signed APK (when configured)
        if: needs.build.outputs.signed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: unifiedtv-signed-release
          path: dist/
      - name: Publish release for this main update
        shell: bash
        env:
          IS_SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          set -euo pipefail
          tag="v0.1.${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists: $tag"
            exit 0
          fi
          if [[ "$IS_SIGNED" == "true" ]]; then
            gh release create "$tag" dist/*.apk dist/SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "UnifiedTV $tag" \
              --generate-notes
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "UnifiedTV $tag (source only)" \
              --notes "Validated source release. APK publication requires repository secrets UNIFIEDTV_KEYSTORE_BASE64, UNIFIEDTV_KEYSTORE_PASSWORD, UNIFIEDTV_KEY_ALIAS and UNIFIEDTV_KEY_PASSWORD. The APK must have a stable signing key to be upgradable."
          fi
