name: UnifiedTV CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unifiedtv-checks:
    name: UnifiedTV integration checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Fork-specific static tests
        run: python3 -m unittest discover -s tests -p 'test_unifiedtv.py' -v
        # The upstream "no network"/576 KB README checks describe a different app.
        # Keep the upstream test sources for reference without treating their product
        # constraints as requirements for this intentional streaming-focused fork.

  launcher:
    name: Android launcher build, unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Test, lint and build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Report size (UnifiedTV includes network catalog and art)
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "UnifiedTV release APK: $((size / 1024)) KiB"
          test "$size" -lt 5242880 || { echo "::error::APK is over 5 MiB; investigate"; exit 1; }
