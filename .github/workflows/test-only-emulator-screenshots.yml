name: UnifiedTV Android TV emulator screenshot comparison (test branch only)

on:
  push:
    branches: [codex/emulator-unifiedtv-shots]

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0 platform-tools
      - name: Fetch old and new official signed release APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shots
          curl --fail --location --retry 3 --silent --show-error -o before.apk 'https://github.com/spidey000/Unifiedtv/releases/download/v0.7.7/UnifiedTV-v0.7.7.apk'
          curl --fail --location --retry 3 --silent --show-error -o after.apk 'https://github.com/spidey000/Unifiedtv/releases/download/v0.7.10/UnifiedTV-v0.7.10.apk'
      - name: Capture both releases using a real Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -eux
            adb shell wm size 1280x720
            adb shell wm density 160
            adb install -r before.apk
            adb shell am start -a android.intent.action.MAIN -c android.intent.category.LEANBACK_LAUNCHER -n io.github.spidey000.unifiedtv/com.gathin.tvhome.MainActivity
            sleep 8
            adb shell screencap -p /sdcard/unifiedtv-before.png
            adb pull /sdcard/unifiedtv-before.png shots/v0.7.7-before.png
            adb uninstall io.github.spidey000.unifiedtv
            adb install after.apk
            adb shell am start -a android.intent.action.MAIN -c android.intent.category.LEANBACK_LAUNCHER -n io.github.spidey000.unifiedtv/com.gathin.tvhome.MainActivity
            sleep 8
            adb shell screencap -p /sdcard/unifiedtv-after.png
            adb pull /sdcard/unifiedtv-after.png shots/v0.7.10-after.png
      - name: Archive real emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unifiedtv-androidtv-emulator-shots
          path: shots/*.png
          if-no-files-found: warn
