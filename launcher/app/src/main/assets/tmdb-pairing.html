<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090c">
<meta name="color-scheme" content="dark">
<title>Conectar TMDB · UnifiedTV</title>
<style>
:root {
  color-scheme: dark;
  --ink: #f7f7f9;
  --muted: #aaaab8;
  --base: #09090c;
  --glass: rgba(24, 24, 30, .78);
  --line: rgba(255, 255, 255, .13);
  --red: #ed314c;
}
* { box-sizing: border-box; }
html { background: var(--base); }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
  color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  background: radial-gradient(ellipse 78% 45% at 50% -8%, #581b2a 0%, transparent 80%),
              radial-gradient(ellipse 60% 50% at 110% 105%, #252333 0%, transparent 75%),
              var(--base);
}
.shell { width: min(100%, 450px); }
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  margin: 0 0 25px 3px;
  font-size: 20px;
  font-weight: 780;
  letter-spacing: -.04em;
}
.mark {
  display: grid;
  place-items: center;
  width: 31px;
  height: 31px;
  border-radius: 9px;
  background: #c5213c;
  box-shadow: 0 6px 22px #d8194638;
}
.mark::after {
  content: "";
  width: 0;
  height: 0;
  margin-left: 3px;
  border-top: 7px solid transparent;
  border-bottom: 7px solid transparent;
  border-left: 11px solid #fff;
}
.brand strong { color: #f7f7f9; font-weight: 780; }
.brand em { font-style: normal; color: #f06b7f; }
main {
  position: relative;
  overflow: hidden;
  width: 100%;
  padding: clamp(25px, 6vw, 35px);
  border: 1px solid var(--line);
  border-radius: 25px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(28px) saturate(135%);
  backdrop-filter: blur(28px) saturate(135%);
  box-shadow: 0 24px 70px rgba(0, 0, 0, .45), inset 0 1px rgba(255, 255, 255, .07);
}
main::before {
  content: "";
  display: block;
  width: 46px;
  height: 4px;
  margin-bottom: 23px;
  border-radius: 4px;
  background: var(--red);
}
.eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 13px;
  color: #c9c9d1;
  font-size: 12px;
  font-weight: 650;
}
.eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
h1 {
  margin: 0;
  max-width: 360px;
  font-size: clamp(29px, 7.6vw, 39px);
  font-weight: 770;
  line-height: 1.09;
  letter-spacing: -.046em;
  text-wrap: balance;
}
p { margin: 15px 0 25px; color: var(--muted); line-height: 1.55; }
form { margin-top: 20px; }
label { display: block; margin-bottom: 9px; font-size: 14px; font-weight: 660; color: #f1f1f4; }
input {
  display: block;
  width: 100%;
  min-height: 55px;
  padding: 14px 16px;
  border: 1px solid rgba(255,255,255,.22);
  border-radius: 13px;
  background: rgba(5, 6, 11, .57);
  color: var(--ink);
  font: 17px/1.4 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  letter-spacing: .04em;
  transition: border-color .18s, background-color .18s;
}
input:focus { border-color: #ef647a; background: rgba(6, 6, 11, .82); }
button {
  display: block;
  width: 100%;
  min-height: 52px;
  margin-top: 15px;
  padding: 12px 20px;
  border: 1px solid rgba(255, 255, 255, .22);
  border-radius: 13px;
  background: rgba(54, 54, 65, .72);
  box-shadow: inset 0 1px rgba(255,255,255,.11), 0 6px 16px rgba(0,0,0,.22);
  color: #fff;
  cursor: pointer;
  font: 700 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  transition: background-color .18s, border-color .18s, transform .18s;
}
button:hover { background: rgba(78, 70, 82, .88); border-color: rgba(255,255,255,.4); }
button:active { transform: scale(.99); }
:focus-visible { outline: 2px solid #ff8ca0; outline-offset: 3px; }
.note {
  margin: 20px 0 0;
  padding-top: 17px;
  border-top: 1px solid rgba(255, 255, 255, .095);
  color: #a8a8b4;
  font-size: 12px;
  line-height: 1.55;
}
.error, .success {
  margin: 20px 0 0;
  padding: 13px 15px;
  border: 1px solid;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.5;
}
.error { color: #ffd3dc; background: rgba(140, 32, 57, .22); border-color: rgba(246, 107, 135, .44); }
.success { color: #baf7d1; background: rgba(25, 107, 62, .2); border-color: rgba(100, 210, 143, .36); }
.footer { margin: 23px 4px 0; color: #797987; font-size: 12px; text-align: center; }
@media (max-width: 380px) {
  body { padding-inline: 14px; }
  main { border-radius: 19px; }
  .brand { margin-bottom: 19px; }
}
@media (prefers-reduced-motion: reduce) {
  input, button { transition: none; }
  button:active { transform: none; }
}
</style>
</head>
<body>
<div class="shell">
<header class="brand" aria-label="UnifiedTV">
  <span class="mark" aria-hidden="true"></span><span><strong>Unified</strong><em>TV</em></span>
</header>
<main>
  <div class="eyebrow">Vinculación con tu televisor</div>
  <h1>%%TITLE%%</h1>
  %%CONTENT%%
</main>
<p class="footer">Conexión local · Sesión temporal de un solo uso</p>
</div>
</body>
</html>
