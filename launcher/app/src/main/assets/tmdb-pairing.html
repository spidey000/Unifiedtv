<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Conectar TMDB · UnifiedTV</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center;
  padding: 24px; font: 16px/1.5 system-ui, sans-serif; color: #f7f7f8; background:
  radial-gradient(ellipse at 84% 10%, #48121f 0%, transparent 43%),
  radial-gradient(ellipse at 5% 100%, #25243d 0%, transparent 55%), #0b0b0f; }
main { width: min(100%, 460px); padding: clamp(22px, 6vw, 38px); border: 1px solid #ffffff24;
  border-radius: 24px; background: #18181fba; backdrop-filter: blur(18px);
  box-shadow: 0 24px 80px #0007; }
.brand { display: flex; align-items: center; gap: 9px; margin-bottom: 28px; font-weight: 700; }
.brand span { display: inline-block; inline-size: 5px; block-size: 21px; border-radius: 3px; background: #e3293f; }
h1 { margin: 0; font-size: clamp(28px, 8vw, 40px); line-height: 1.08; letter-spacing: -.04em; }
p { color: #c4c4cf; margin: 14px 0 22px; }
label { display: block; margin-bottom: 8px; font-weight: 600; }
input, button { width: 100%; min-height: 50px; padding: 11px 14px; font: inherit; color: inherit;
  border-radius: 12px; border: 1px solid #ffffff2e; background: #0b0b0f8c; }
button { margin-top: 14px; background: #a81d35; border-color: #fd63747a; cursor: pointer; font-weight: 700; }
button:hover { background: #bd2540; }
:focus-visible { outline: 2px solid #ff8191; outline-offset: 3px; }
.note { margin: 18px 0 0; font-size: .875rem; }
.error, .success { padding: 12px 14px; border-radius: 12px; border: 1px solid currentColor; }
.error { color: #ffacb7; background: #63172655; }
.success { color: #a5eac0; background: #20402f70; margin-bottom: 0; }
</style>
</head>
<body>
<main>
<div class="brand"><span aria-hidden="true"></span>UnifiedTV</div>
<h1>%%TITLE%%</h1>
%%CONTENT%%
</main>
</body>
</html>
